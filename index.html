<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunga 3D Parallax</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0618;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;perspective:900px;perspective-origin:50% 45%;background:radial-gradient(ellipse at 50% 40%,#3a1250 0%,#1a0a33 45%,#0b0618 100%);touch-action:none}
#world{position:absolute;left:50%;top:44%;width:0;height:0;transform:scale(var(--s,1));transform-style:preserve-3d}
#scene,#plant,#head,.ring,#bg,#fg,#fall{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.dust{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,200,230,0) 70%);animation:float var(--t) ease-in-out infinite alternate}
@keyframes float{from{margin-top:0;opacity:.2}to{margin-top:-60px;opacity:1}}
#rise{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateY(1100px);transition:transform 6.5s cubic-bezier(.25,.65,.2,1)}
.open #rise{transform:translateY(0)}
.reset *{transition:none!important}
#plant{transform-origin:0 520px;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateZ(-2.2deg)}to{transform:rotateZ(2.2deg)}}
.stem{position:absolute;left:-8px;top:10px;width:16px;height:520px;border-radius:8px;background:linear-gradient(90deg,#0f5a3a,#2fbf71 50%,#0f5a3a);transform:translateZ(-10px)}
.leaf{position:absolute;width:150px;height:70px;background:linear-gradient(135deg,#43e08a,#0f6b43);border-radius:0 100% 0 100%;opacity:0;transition:transform 3.2s cubic-bezier(.25,.9,.3,1) 3.5s,opacity 1.6s 3.5s;box-shadow:inset 0 0 20px rgba(0,0,0,.3)}
.leaf.l{left:-150px;top:300px;transform-origin:100% 100%;transform:translateZ(10px) rotateY(180deg) rotateZ(-20deg) scale(0)}
.leaf.r{left:8px;top:380px;transform-origin:0 100%;transform:translateZ(30px) rotateZ(-20deg) scale(0)}

.open .leaf.l{opacity:1;transform:translateZ(10px) rotateY(180deg) rotateZ(-20deg) scale(1)}
.open .leaf.r{opacity:1;transform:translateZ(30px) rotateZ(-20deg) scale(1)}
#head{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotateZ(360deg)}}
.petal{position:absolute;transform-origin:50% 100%;border-radius:50% 50% 45% 45%/85% 85% 18% 18%;background:linear-gradient(to top,#d81b72 0%,#ff5fa2 30%,#ffb3d4 75%,#fff1f7 100%);box-shadow:inset 0 -20px 30px rgba(120,0,60,.35),0 0 25px rgba(255,90,160,.35);opacity:1;transform:translateZ(var(--z)) rotateZ(var(--a)) rotateX(-72deg) scale(.5);transition:transform 5s cubic-bezier(.25,.8,.3,1) var(--d),opacity 2.2s var(--d)}
.petal::after{content:"";position:absolute;left:50%;top:12%;bottom:6%;width:2px;margin-left:-1px;background:linear-gradient(to top,rgba(150,0,80,.4),transparent);border-radius:2px}
.open .petal{opacity:1;transform:translateZ(var(--z)) rotateZ(var(--a)) rotateX(var(--tilt)) scale(1)}
.core{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a8,#ffc928 45%,#c46a00 100%);box-shadow:0 0 40px 10px rgba(255,200,60,.55);transform:translateZ(80px) scale(0);transition:transform 3s cubic-bezier(.25,1.2,.3,1) 7.5s;animation:pulse 2.4s ease-in-out infinite alternate}
.open .core{transform:translateZ(80px) scale(1)}
@keyframes pulse{to{box-shadow:0 0 70px 22px rgba(255,200,60,.8)}}
.seed{position:absolute;width:5px;height:5px;border-radius:50%;background:#8a4300;opacity:.7}
#btn{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;padding:12px 24px;border-radius:999px;font-size:15px;cursor:pointer}
#btn:hover{background:rgba(255,255,255,.2)}
.fp{position:absolute;left:0;top:0;border-radius:50% 50% 45% 45%/85% 85% 18% 18%;background:linear-gradient(to top,#d81b72,#ff6fae 45%,#ffc4de);box-shadow:inset 0 -6px 10px rgba(120,0,60,.3),0 0 12px rgba(255,100,170,.45);opacity:0;will-change:transform}
#hint{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));width:100%;text-align:center;color:rgba(255,255,255,.55);font-size:13px;letter-spacing:.04em;z-index:5;pointer-events:none}
</style>
</head>
<body>
<div id="hint">Gerakkan kursor atau geser layar</div>
<div id="stage">
  <div id="world">
    <div id="scene">
      <div id="bg"></div>
      <div id="rise"><div id="plant">
        <div class="stem"></div>
        <div class="leaf l"></div>
        <div class="leaf r"></div>
        <div id="head"></div>
        <div class="core" id="core"></div>
      </div></div>
      <div id="fall"></div>
      <div id="fg"></div>
    </div>
  </div>
</div>
<button id="btn">✿ Mekar lagi</button>
<script>
const $=s=>document.querySelector(s);
const world=$('#world'),scene=$('#scene'),head=$('#head'),bg=$('#bg'),fg=$('#fg'),core=$('#core');
const R=(a,b)=>a+Math.random()*(b-a);

// Petal rings: n, length, width, tilt, z
const rings=[
  {n:12,len:200,w:90,tilt:-18,z:0},
  {n:10,len:165,w:82,tilt:-38,z:30},
  {n:8,len:130,w:70,tilt:-58,z:60},
  {n:6,len:95,w:54,tilt:-76,z:85}
];
rings.forEach((r,ri)=>{
  const off=ri%2?180/r.n:0;
  for(let i=0;i<r.n;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.cssText=`width:${r.w}px;height:${r.len}px;left:${-r.w/2}px;top:${-r.len}px;--a:${i*360/r.n+off}deg;--tilt:${r.tilt}deg;--z:${r.z}px;--d:${(3.8+ri*0.8+i*0.14).toFixed(2)}s`;
    head.appendChild(p);
  }
});
// seeds on core
for(let i=0;i<28;i++){
  const s=document.createElement('i');s.className='seed';
  const a=R(0,6.28),d=R(4,28);
  s.style.left=(34+Math.cos(a)*d-2)+'px';s.style.top=(34+Math.sin(a)*d-2)+'px';
  core.appendChild(s);
}
// Background orbs (deep layers)
[['#ff3d8b',-520,-200,-480,420],['#7a3dff',480,120,-380,380],['#ff9a3d',-300,420,-300,300],['#3dd6ff',360,-300,-560,340]].forEach(o=>{
  const d=document.createElement('div');d.className='orb';
  d.style.cssText=`width:${o[4]}px;height:${o[4]}px;left:${o[1]-o[4]/2}px;top:${o[2]-o[4]/2}px;background:${o[0]};transform:translateZ(${o[3]}px)`;
  bg.appendChild(d);
});
// Dust particles at varied depths (behind + in front)
for(let i=0;i<46;i++){
  const z=R(-350,380),sz=R(3,9)*(1+z/700);
  const d=document.createElement('div');d.className='dust';
  d.style.cssText=`width:${sz}px;height:${sz}px;left:${R(-520,520)}px;top:${R(-380,520)}px;transform:translateZ(${z}px);--t:${R(3,8).toFixed(1)}s;animation-delay:${-R(0,6).toFixed(1)}s`;
  (z>120?fg:bg).appendChild(d);
}

// Fit to screen
function fit(){world.style.setProperty('--s',Math.min(innerWidth/760,innerHeight/900).toFixed(3))}
addEventListener('resize',fit);fit();

// Parallax: pointer + gentle idle drift
let px=0,py=0,cx=0,cy=0;
function setP(x,y){px=(x/innerWidth-.5)*2;py=(y/innerHeight-.5)*2}
addEventListener('pointermove',e=>setP(e.clientX,e.clientY));
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;px=Math.max(-1,Math.min(1,e.gamma/30));py=Math.max(-1,Math.min(1,(e.beta-45)/30))});
function tick(t){
  const ix=Math.sin(t*.0006)*.35,iy=Math.cos(t*.0005)*.25;
  cx+=((px+ix)-cx)*.06;cy+=((py+iy)-cy)*.06;
  scene.style.transform=`rotateX(${(-cy*16+8).toFixed(2)}deg) rotateY(${(cx*26).toFixed(2)}deg)`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// Bloom
// Falling petals
const fall=$('#fall'),fps=[];let falling=false,nextSpawn=0,last=0,fallTimer;
function spawn(){
  if(fps.length>=34)return;
  const w=R(16,30),el=document.createElement('div');
  el.className='fp';el.style.width=w+'px';el.style.height=(w*1.55)+'px';
  fall.appendChild(el);
  fps.push({el,x:R(-170,170),y:R(-130,40),z:R(-120,300),vy:R(38,80),sw:R(25,70),f:R(.6,1.4),ph:R(0,6.28),rx:R(0,360),ry:R(0,360),rz:R(0,360),vrx:R(-140,140),vry:R(-160,160),vrz:R(-90,90),age:0});
}
function fallLoop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(falling&&t>nextSpawn){spawn();nextSpawn=t+R(450,1000)}
  for(let i=fps.length-1;i>=0;i--){
    const p=fps[i];p.age+=dt;
    p.y+=p.vy*dt;
    p.x+=Math.sin(p.age*p.f+p.ph)*p.sw*dt+12*dt;
    p.rx+=p.vrx*dt;p.ry+=p.vry*dt;p.rz+=p.vrz*dt;
    const o=Math.min(1,p.age/1.2)*Math.min(1,Math.max(0,(620-p.y)/120));
    p.el.style.opacity=o.toFixed(3);
    p.el.style.transform='translate3d('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px,'+p.z.toFixed(1)+'px) rotateX('+p.rx.toFixed(1)+'deg) rotateY('+p.ry.toFixed(1)+'deg) rotateZ('+p.rz.toFixed(1)+'deg)';
    if(p.y>640){p.el.remove();fps.splice(i,1)}
  }
  requestAnimationFrame(fallLoop);
}
requestAnimationFrame(fallLoop);

function bloom(){
  world.classList.add('reset');world.classList.remove('open');falling=false;clearTimeout(fallTimer);
  void world.offsetWidth;world.classList.remove('reset');void world.offsetWidth;
  setTimeout(()=>world.classList.add('open'),120);
  fallTimer=setTimeout(()=>{falling=true},13000);
}
$('#btn').addEventListener('click',bloom);
setTimeout(bloom,250);
</script>
</body>
</html>
